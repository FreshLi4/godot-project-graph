name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  godot:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install Godot .NET and headless font support
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig
          archive="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${archive}.zip"
          unzip -q "${RUNNER_TEMP}/godot.zip" -d "${RUNNER_TEMP}/godot"
          chmod +x "${RUNNER_TEMP}/godot/${archive}/${archive}"
          echo "GODOT_BIN=${RUNNER_TEMP}/godot/${archive}/${archive}" >> "${GITHUB_ENV}"
      - name: Build C# and import fixtures
        run: |
          dotnet build ProjectGraph.csproj
          "${GODOT_BIN}" --headless --editor --path . --import --quit
      - name: Run scanner, layout and routing tests
        run: '"${GODOT_BIN}" --headless --path . res://tests/test_runner.tscn'
      - name: Smoke isolated C# addon installation
        shell: bash
        run: |
          set -euo pipefail
          install_root="$(mktemp -d)"
          mkdir -p "${install_root}/tests"
          cp tests/install_project.cfg "${install_root}/project.godot"
          cp ProjectGraph.csproj "${install_root}/ProjectGraph.csproj"
          cp -R addons "${install_root}/addons"
          cp -R tests/fixtures "${install_root}/tests/fixtures"
          cd "${install_root}"
          dotnet build ProjectGraph.csproj
          "${GODOT_BIN}" --headless --editor --path "${install_root}" --import --quit
          "${GODOT_BIN}" --headless --editor --path "${install_root}" --quit-after 600 -- --project-graph-smoke 2>&1 | tee editor-smoke.log
          grep -q "PASS: Project Graph editor panel smoke" editor-smoke.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" editor-smoke.log
